# Hosted model retirements the kit is built for. One row per model.
# Fix dates here only: the README table is rendered from this file
# (uv run python -m kit.retirements) and a test checks they match.
#
# kind: "shutoff" = requests fail after the date; "reroute" = requests keep
# working but are answered by the replacement model (and billed at its rates).

- model: claude-sonnet-4-5-20250929
  provider: anthropic
  litellm: anthropic/claude-sonnet-4-5-20250929
  retires: 2026-11-30
  replacement: claude-sonnet-5-5
  kind: shutoff
  source: https://platform.claude.com/docs/en/about-claude/model-deprecations
  checked_on: 2026-11-13

- model: o-series
